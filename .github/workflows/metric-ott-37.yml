name: METRIC + OTT with the full 37-machine collection

on:
  workflow_dispatch:
  push:
    branches: ['codex/metric-ott-37-machines', 'codex/metric2-ott-mix-37', 'codex/ott-efficiency-37', 'codex/ott-onepole-37']
    paths:
      - '.github/workflows/metric-ott-37.yml'
      - 'metric-performance/**'
      - 'metric-layout.json'
      - 'custom-37-layout.json'
      - 'derive-expanded-profile.mjs'
      - 'verify-custom-collection.py'
      - 'ott-tests/**'
      - 'sdk-ott-insert.patch'
      - 'ott-rounded-multiply.patch'
      - 'ott-onepole-phase-fix.patch'
      - 'sdk-scaled-pattern-input.patch'

permissions:
  contents: read

jobs:
  ott-host:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: grame-cncm/faustlibraries
          ref: ecf019c75d9860903d854c8c72a0907c8ac3b4e4
          path: test-faustlibraries
          persist-credentials: false
      - name: Extract authenticated SDK and apply reviewed patches
        shell: bash
        run: |
          printf '%s  source.zip\n' c28f62389d6813b4edb54e6db6141b15b37fde5acf609cdf05b8324ed3aed04f | shasum -a 256 -c
          python3 -m zipfile -e source.zip "$RUNNER_TEMP/metric-inputs"
          for patch in sdk-scaled-pattern-input.patch sdk-ott-insert.patch ott-rounded-multiply.patch ott-onepole-phase-fix.patch; do
            git -C "$RUNNER_TEMP/metric-inputs/open-xy" -c core.autocrlf=false apply --check "$GITHUB_WORKSPACE/$patch"
            git -C "$RUNNER_TEMP/metric-inputs/open-xy" -c core.autocrlf=false apply "$GITHUB_WORKSPACE/$patch"
          done
      - name: Authenticate and mount Faust 2.88.0
        shell: bash
        run: |
          case "$(uname -m)" in
            arm64)
              arch=arm64
              checksum=1f8b4663767c7798a928dda9eed11b445e11a21e4611bd1209e7c64a40fc6500
              ;;
            x86_64)
              arch=x64
              checksum=c20bca6f95b60a52b7b822e8efe4673f2bd63bf3e9052a246bda702a96157459
              ;;
            *) exit 1 ;;
          esac
          image="$RUNNER_TEMP/metric-faust.dmg"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/grame-cncm/faust/releases/download/2.88.0/Faust-2.88.0-$arch.dmg" -o "$image"
          printf '%s  %s\n' "$checksum" "$image" | shasum -a 256 -c
          hdiutil attach "$image" -readonly -nobrowse -mountpoint "$RUNNER_TEMP/metric-faust"
      - name: Run OTT host and independent Faust reference tests
        shell: bash
        run: |
          bash ott-tests/run-host-tests.sh "$RUNNER_TEMP/metric-inputs/open-xy" \
            "$RUNNER_TEMP/metric-faust/Faust-2.88.0" "$GITHUB_WORKSPACE/test-faustlibraries" \
            "$RUNNER_TEMP/ott-host-tests"

  baseline:
    needs: ott-host
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Authenticate and extract build inputs
        run: |
          $archive = Join-Path $PWD 'source.zip'
          $expected = 'c28f62389d6813b4edb54e6db6141b15b37fde5acf609cdf05b8324ed3aed04f'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $expected) {
            throw 'Source archive does not match the verified Git LFS object.'
          }
          $inputs = Join-Path $env:RUNNER_TEMP 'metric-inputs'
          python -m zipfile -e $archive $inputs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $stock = Join-Path $inputs 'stock-original-os.ldr'
          if ((Get-FileHash $stock -Algorithm SHA256).Hash -ne '60358afdaa9b58ed40411602f6d5d4e1e3e02553ff2da7e25038e71dd002b52f') {
            throw 'Stock OP-XY 1.2.1 image hash mismatch.'
          }
      - name: Apply the METRIC input and OTT integration patches
        run: |
          Set-Location (Join-Path $env:RUNNER_TEMP 'metric-inputs/open-xy')
          @'
          import os
          from pathlib import Path

          for name in ('sdk-scaled-pattern-input.patch', 'sdk-ott-insert.patch', 'ott-rounded-multiply.patch', 'ott-onepole-phase-fix.patch'):
              original = Path(os.environ['GITHUB_WORKSPACE']) / name
              normalized = Path(os.environ['RUNNER_TEMP']) / name
              normalized.write_bytes(original.read_bytes().replace(bytes([13, 10]), bytes([10])))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($name in @('sdk-scaled-pattern-input.patch', 'sdk-ott-insert.patch', 'ott-rounded-multiply.patch', 'ott-onepole-phase-fix.patch')) {
            $patch = Join-Path $env:RUNNER_TEMP $name
            git -c core.autocrlf=false apply --check $patch
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git -c core.autocrlf=false apply $patch
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Apply the reviewed 4 MiB memory layout
        run: |
          Set-Location (Join-Path $env:RUNNER_TEMP 'metric-inputs/open-xy')
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'derive-expanded-profile.mjs') .
          node derive-expanded-profile.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Authenticate the pinned Blackfin toolchain
        run: |
          Set-Location (Join-Path $env:RUNNER_TEMP 'metric-inputs/open-xy')
          python sdk.py toolchain fetch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python sdk.py doctor --toolchain
      - name: Build METRIC with OTT and independently verify the package
        run: |
          $inputs = Join-Path $env:RUNNER_TEMP 'metric-inputs'
          $stock = Join-Path $inputs 'stock-original-os.ldr'
          $output = Join-Path $env:RUNNER_TEMP 'metric-native-baseline'
          Set-Location (Join-Path $inputs 'open-xy')
          $env:PYTHONPATH = $PWD.Path
          $check = Join-Path $env:GITHUB_WORKSPACE 'verify-custom-collection.py'
          python $check prepare $env:GITHUB_WORKSPACE $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $metric = Join-Path $env:GITHUB_WORKSPACE 'metric-performance'
          python sdk.py build --collection local/catalog/metric-collection.json --machine $metric --layout local/combined-layout.json --stock-os $stock --profiling on --sweep off --out $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python sdk.py verify --package $output --stock-os $stock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python $check verify $env:GITHUB_WORKSPACE $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python (Join-Path $env:GITHUB_WORKSPACE 'ott-tests/audit-blackfin.py') (Join-Path $output 'analysis')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash (Join-Path $output 'candidate/os.ldr') -Algorithm SHA256
      - name: Archive layout and verification reports
        uses: actions/upload-artifact@v4
        with:
          name: metric-ott-37-windows-verification
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/metric-native-baseline/layout.json
            ${{ runner.temp }}/metric-native-baseline/expanded-layout.json
            ${{ runner.temp }}/metric-native-baseline/manifest.json
            ${{ runner.temp }}/metric-native-baseline/verification.json
            ${{ runner.temp }}/metric-native-baseline/analysis/compile-report.json
      - name: Archive experimental candidate in the private repository
        if: ${{ github.event.repository.private }}
        uses: actions/upload-artifact@v4
        with:
          name: metric-ott-37-experimental-candidate
          if-no-files-found: error
          path: ${{ runner.temp }}/metric-native-baseline/candidate/
