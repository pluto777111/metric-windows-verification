name: METRIC and OTT Windows build

on:
  workflow_dispatch:
  push:
    branches: ['codex/metric-ott']
    paths:
      - '.github/workflows/metric-ott.yml'
      - 'metric-performance/**'
      - 'metric-layout.json'
      - 'ott-tests/**'
      - 'sdk-ott-insert.patch'
      - 'sdk-scaled-pattern-input.patch'

permissions:
  contents: read

jobs:
  baseline:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Authenticate and extract build inputs
        run: |
          $archive = Join-Path $PWD 'source.zip'
          $expected = 'c28f62389d6813b4edb54e6db6141b15b37fde5acf609cdf05b8324ed3aed04f'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $expected) {
            throw 'Source archive does not match the verified Git LFS object.'
          }
          $inputs = Join-Path $env:RUNNER_TEMP 'metric-inputs'
          python -m zipfile -e $archive $inputs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $stock = Join-Path $inputs 'stock-original-os.ldr'
          if ((Get-FileHash $stock -Algorithm SHA256).Hash -ne '60358afdaa9b58ed40411602f6d5d4e1e3e02553ff2da7e25038e71dd002b52f') {
            throw 'Stock OP-XY 1.2.1 image hash mismatch.'
          }
      - name: Apply the METRIC input and OTT integration patches
        run: |
          Set-Location (Join-Path $env:RUNNER_TEMP 'metric-inputs/open-xy')
          @'
          import os
          from pathlib import Path

          for name in ('sdk-scaled-pattern-input.patch', 'sdk-ott-insert.patch'):
              original = Path(os.environ['GITHUB_WORKSPACE']) / name
              normalized = Path(os.environ['RUNNER_TEMP']) / name
              normalized.write_bytes(original.read_bytes().replace(bytes([13, 10]), bytes([10])))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($name in @('sdk-scaled-pattern-input.patch', 'sdk-ott-insert.patch')) {
            $patch = Join-Path $env:RUNNER_TEMP $name
            git -c core.autocrlf=false apply --check $patch
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git -c core.autocrlf=false apply $patch
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Authenticate the pinned Blackfin toolchain
        run: |
          Set-Location (Join-Path $env:RUNNER_TEMP 'metric-inputs/open-xy')
          python sdk.py toolchain fetch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python sdk.py doctor --toolchain
      - name: Build METRIC with OTT and independently verify the package
        run: |
          $inputs = Join-Path $env:RUNNER_TEMP 'metric-inputs'
          $stock = Join-Path $inputs 'stock-original-os.ldr'
          $output = Join-Path $env:RUNNER_TEMP 'metric-native-baseline'
          Set-Location (Join-Path $inputs 'open-xy')
          @'
          import json
          from pathlib import Path

          from tooling.catalog import OFFICIAL
          from tooling.machines import machine_at

          catalog = Path('local/catalog')
          collection = json.loads((catalog / 'metric-collection.json').read_text(encoding='utf-8'))
          collection['machines'] = [
              entry for entry in collection['machines']
              if machine_at(catalog / entry['path']).id in OFFICIAL
          ]
          (catalog / 'metric-native-baseline.json').write_text(json.dumps(collection), encoding='utf-8')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $metric = Join-Path $env:GITHUB_WORKSPACE 'metric-performance'
          $layout = Join-Path $env:GITHUB_WORKSPACE 'metric-layout.json'
          $expectedLayout = '5bda0b84b232ebdd582c64b13bed673bc218138aec9dc19624d85d4a51058e3c'
          if ((Get-FileHash $layout -Algorithm SHA256).Hash -ne $expectedLayout) {
            throw 'The input layout does not match the known-good METRIC build.'
          }
          python sdk.py build --collection local/catalog/metric-native-baseline.json --machine $metric --layout $layout --stock-os $stock --profiling on --sweep on --out $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python sdk.py verify --package $output --stock-os $stock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $verification = Get-Content (Join-Path $output 'verification.json') -Raw | ConvertFrom-Json
          if ($verification.linked -notcontains 'metric') {
            throw 'The SDK linked its core fallback without METRIC.'
          }
          $manifest = Get-Content (Join-Path $output 'manifest.json') -Raw | ConvertFrom-Json
          $ids = $manifest.layout.metric
          if ($ids.engine -ne 163 -or $ids.page -ne 139) {
            throw 'METRIC engine/page registry mismatch.'
          }
          $compile = Get-Content (Join-Path $output 'analysis/compile-report.json') -Raw | ConvertFrom-Json
          if ($compile.services -notcontains 'ott_insert' -or $compile.services -notcontains 'drum_sends') {
            throw 'Missing OTT or the baseline per-key sends service.'
          }
          if ((Get-FileHash (Join-Path $output 'layout.json') -Algorithm SHA256).Hash -ne $expectedLayout) {
            throw 'The combined firmware changed the existing METRIC layout.'
          }
          Get-FileHash (Join-Path $output 'candidate/os.ldr') -Algorithm SHA256
      - name: Archive layout and verification reports
        uses: actions/upload-artifact@v4
        with:
          name: metric-ott-windows-verification
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/metric-native-baseline/layout.json
            ${{ runner.temp }}/metric-native-baseline/manifest.json
            ${{ runner.temp }}/metric-native-baseline/verification.json
            ${{ runner.temp }}/metric-native-baseline/analysis/compile-report.json
      - name: Archive experimental candidate in the private repository
        if: ${{ github.event.repository.private }}
        uses: actions/upload-artifact@v4
        with:
          name: metric-ott-experimental-candidate
          if-no-files-found: error
          path: ${{ runner.temp }}/metric-native-baseline/candidate/
